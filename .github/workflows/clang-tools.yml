name: clang-tools-static

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        matrix.clang-version }}-${{ matrix.os }}-${{ matrix.runner }}
      cancel-in-progress: true
    strategy:
      matrix:
        clang-version: [ 21, 22, 23 ]
        os: [ linux, linux-arm, macosx, macos-arm, windows, windows-arm ]
        include:
          - clang-version: 21
            release: llvm-project-21.1.6.src
          - clang-version: 22
            release: llvm-project-22.1.8.src
          - clang-version: 23
            release: llvm-project-23.1.4.src
          - os: linux
            runner: ubuntu-24.04
            os-cmake-args: '-DLLVM_BUILD_STATIC=ON -DCMAKE_CXX_FLAGS="-s -flto" ${POSIX_CMAKE_ARGS} ${LINUX_CMAKE_ARGS}'
            build-args: '-j$(nproc)'
            bindir: '/build/bin'
            dotexe: ''
            shacmd: 'sha512sum'
            arch: 'amd64'
          - os: linux-arm
            runner: ubuntu-24.04-arm
            os-cmake-args: '-DLLVM_BUILD_STATIC=ON -DCMAKE_CXX_FLAGS="-s -flto" ${POSIX_CMAKE_ARGS} ${LINUX_CMAKE_ARGS} -DLLVM_TARGETS_TO_BUILD=AArch64'
            build-args: '-j$(nproc)'
            bindir: '/build/bin'
            dotexe: ''
            shacmd: 'sha512sum'
            arch: 'arm64'
          - os: macosx
            runner: macos-15-intel
            os-cmake-args: '-DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++ -flto -ffunction-sections -fdata-sections" -DCMAKE_EXE_LINKER_FLAGS="-Wl,-dead_strip" ${POSIX_CMAKE_ARGS} ${MACOS_CMAKE_ARGS} -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DLLVM_TARGETS_TO_BUILD=X86'
            build-args: '-j$(sysctl -n hw.ncpu)'
            bindir: '/build/bin'
            dotexe: ''
            shacmd: 'shasum -a512'
            arch: 'amd64'
          - os: macos-arm
            runner: macos-15
            os-cmake-args: '-DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++ -flto -ffunction-sections -fdata-sections" -DCMAKE_EXE_LINKER_FLAGS="-Wl,-dead_strip" ${POSIX_CMAKE_ARGS} ${MACOS_CMAKE_ARGS} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DLLVM_TARGETS_TO_BUILD=AArch64'
            build-args: '-j$(sysctl -n hw.ncpu)'
            bindir: '/build/bin'
            dotexe: ''
            shacmd: 'shasum -a512'
            arch: 'arm64'
          - os: windows
            runner: windows-latest
            os-cmake-args: '-Thost=x64 -DCMAKE_CXX_FLAGS="/MP /std:c++14" -DLLVM_USE_CRT_MINSIZEREL="MT"'
            build-args: '--config MinSizeRel'
            bindir: '/build/MinSizeRel/bin'
            dotexe: '.exe'
            shacmd: 'sha512sum.exe'
            extra-tar-args: '--exclude=${RELEASE}/clang/test/Driver/Inputs/* --exclude=${RELEASE}/libcxx/test/std/input.output/filesystems/Inputs/static_test_env/* --exclude=${RELEASE}/libclc/amdgcn-mesa3d'
            arch: 'amd64'
          - os: windows-arm
            runner: windows-11-arm
            os-cmake-args: '-A ARM64 -DCMAKE_CXX_FLAGS="/MP /std:c++14" -DLLVM_USE_CRT_MINSIZEREL="MT" -DLLVM_TARGETS_TO_BUILD=AArch64'
            build-args: '--config MinSizeRel'
            bindir: '/build/MinSizeRel/bin'
            dotexe: '.exe'
            shacmd: 'sha512sum.exe'
            extra-tar-args: '--exclude=${RELEASE}/clang/test/Driver/Inputs/* --exclude=${RELEASE}/libcxx/test/std/input.output/filesystems/Inputs/static_test_env/* --exclude=${RELEASE}/libclc/amdgcn-mesa3d'
            arch: 'arm64'
    runs-on: ${{ matrix.runner }}
    env:
      COMMON_CMAKE_ARGS: '-DBUILD_SHARED_LIBS=OFF -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra"'
      LINUX_CMAKE_ARGS: '-DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14'
      MACOS_CMAKE_ARGS: '-DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF'
      POSIX_CMAKE_ARGS: '-DCMAKE_BUILD_TYPE=MinSizeRel'
      RELEASE: '${{ matrix.release }}'
      suffix: '${{ matrix.clang-version }}_${{ matrix.os }}-${{ matrix.arch }}'
    steps:
    - name: print system info on macos and linux
      run: |
        uname -a || systeminfo
      if: ${{ !startsWith(matrix.os, 'windows') }}
    - name: get llvm-project
      shell: bash
      run: |
        version=${RELEASE##llvm-project-}; version=${version%.src}
        curl -LO https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${{ matrix.release }}.tar.xz

    - name: unpack llvm-project
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == windows* ]]; then
          # Windows: tar cannot create dangling symlinks (symlink target not yet extracted).
          # Fix: enable winsymlinks via MSYS env var and run tar twice so that on the
          # second pass all symlink targets already exist.
          export MSYS=winsymlinks:lnk
          tar --ignore-failed-read -xf ${{ matrix.release }}.tar.xz ${{ matrix.extra-tar-args }} || true
          tar --ignore-failed-read -xf ${{ matrix.release }}.tar.xz ${{ matrix.extra-tar-args }} || true
        else
          tar xf ${{ matrix.release }}.tar.xz ${{ matrix.extra-tar-args }}
        fi

    - name: Patch cmake implicit link libraries on macosx
      if: ${{ matrix.os == 'macosx' || matrix.os == 'macos-arm' }}
      shell: bash
      run: |
        BREW_PREFIX=$(brew --prefix)
        FILES=$(find "$BREW_PREFIX" -name CMakeParseImplicitLinkInfo.cmake)
        
        for file in $FILES; do
          echo "Patching $file"
          sed -i.backup 's/gcc_eh.*|/gcc_eh.*|gcc_ext.*|/g' "$file"
        done

    - name: cmake
      run: cmake -S ${{ matrix.release }}/llvm -B ${{ matrix.release }}/build ${{ env.COMMON_CMAKE_ARGS }} ${{ matrix.os-cmake-args }}
    - name: build
      run: cmake --build ${{ matrix.release }}/build ${{ matrix.build-args }} --target clang-format clang-query clang-tidy clang-apply-replacements
    - name: print dependencies
      if: ${{ matrix.os == 'macosx' || matrix.os == 'macos-arm' }}
      run: otool -L ${{ matrix.release }}/build/bin/clang-format
    - name: smoke test clang-tools (macos, linux)
      if: ${{ !startsWith(matrix.os, 'windows') }}
      run: |
        cd ${{ matrix.release }}/build/bin
        ./clang-format --version
        ./clang-query --version
        ./clang-tidy --version
        ./clang-apply-replacements --version
    - name: smoke test clang-tools (windows)
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: |
        cd ${{ matrix.release }}${{ matrix.bindir }}
        clang-format${{ matrix.dotexe }} --version
        clang-query${{ matrix.dotexe }} --version
        clang-tidy${{ matrix.dotexe }} --version
        clang-apply-replacements${{ matrix.dotexe }} --version
    - name: rename output binary
      run: |
        cd ${{ matrix.release }}${{ matrix.bindir }}
        mv clang-format${{ matrix.dotexe }} clang-format-${{ env.suffix }}${{ matrix.dotexe }}
        mv clang-query${{ matrix.dotexe }} clang-query-${{ env.suffix }}${{ matrix.dotexe }}
        mv clang-tidy${{ matrix.dotexe }} clang-tidy-${{ env.suffix }}${{ matrix.dotexe }}
        mv clang-apply-replacements${{ matrix.dotexe }} clang-apply-replacements-${{ env.suffix }}${{ matrix.dotexe }}
    - name: create and print sha512sum
      shell: bash
      run: |
        cd ${{ matrix.release }}${{ matrix.bindir }}
        ${{ matrix.shacmd }} clang-format-${{ env.suffix }} > clang-format-${{ env.suffix }}.sha512sum
        ${{ matrix.shacmd }} clang-query-${{ env.suffix }} > clang-query-${{ env.suffix }}.sha512sum
        ${{ matrix.shacmd }} clang-tidy-${{ env.suffix }} > clang-tidy-${{ env.suffix }}.sha512sum
        ${{ matrix.shacmd }} clang-apply-replacements-${{ env.suffix }} > clang-apply-replacements-${{ env.suffix }}.sha512sum
        echo "Checksums are: "
        cat clang-format-${{ env.suffix }}.sha512sum
        cat clang-query-${{ env.suffix }}.sha512sum
        cat clang-tidy-${{ env.suffix }}.sha512sum
        cat clang-apply-replacements-${{ env.suffix }}.sha512sum
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: clang-tools-${{ matrix.release }}-${{ env.suffix }}
        path: "${{ matrix.release }}${{ matrix.bindir }}/clang-*-${{ env.suffix }}*"
        retention-days: 1
  test-release:
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        '' }}-${{ matrix.os }}-${{ matrix.runner }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [ linux, linux-arm, macosx, windows, macos-arm, windows-arm ]
        include:
          - os: linux
            runner: ubuntu-24.04
            arch: 'amd64'
          - os: linux-arm
            runner: ubuntu-24.04-arm
            arch: 'arm64'
          - os: macosx
            runner: macos-15-intel
            arch: 'amd64'
          - os: windows
            runner: windows-latest
            arch: 'amd64'
          - os: macos-arm
            runner: macos-latest
            arch: 'arm64'
          - os: windows-arm
            runner: windows-11-arm
            arch: 'arm64'
    runs-on: ${{ matrix.runner }}
    needs: build
    env:
      suffix: '_${{ matrix.os }}-${{ matrix.arch }}'
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '**/*${{ env.suffix }}'
      - name: list files (macos, linux)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: ls -laR artifacts/
      - name: smoke test each clang tool (macos, linux)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          cd artifacts
          # From the artifacts directory, loop over each executable
          # (not .sha512sum files) and 
          # invoke the --version command to verify
          
          for tool in $(find . -type f); do
            # Skip the sha512sum files
            if [[ $tool == *.sha512sum ]]; then
              continue
            fi
            chmod +x $tool
            # Run the tool with --version and print the output
            echo "Running $tool --version"
            $tool --version
          done
      - name: List files (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
          Get-ChildItem -Recurse artifacts | Format-List

      - name: Smoke test each clang tool (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: pwsh
        run: |
          Set-Location artifacts

          # Find all files excluding *.sha512sum
          $tools = Get-ChildItem -Recurse -File | Where-Object { $_.Name -notlike '*.sha512sum' }

          foreach ($tool in $tools) {
              # Ensure the file is executable
              $toolPath = $tool.FullName

              # Print which tool is being run
              Write-Host "Running $toolPath --version"

              try {
                  # Attempt to run the tool with --version
                  & $toolPath --version
              } catch {
                  Write-Host "Failed to run $toolPath --version. Error: $_"
              }
          }
  draft-release:
    runs-on: ubuntu-24.04
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [build, test-release]
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
      - name: list files
        run: ls -laR .
      - name: Workaround - delete all files over 2G, above github release file upload limit
        run: find . -type f -size +2G -exec rm -v {} \;
      - name: create tar.gz archives
        run: |
          set -euo pipefail
          mkdir -p tarballs
          count=0
          for dir in clang-*/; do
            [ -d "$dir" ] || continue
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              case "$name" in
                *.sha512sum|*.tar.gz) continue ;;
              esac
              stem="$name"
              ext=""
              case "$stem" in
                *.exe) ext=".exe"; stem="${stem%.exe}" ;;
              esac
              base=$(printf '%s' "$stem" | sed -E 's/-[0-9]+_.*$//')
              if [ -z "$base" ] || [ "$base" = "$stem" ]; then
                echo "::error::Cannot derive the binary name from '$name'"
                exit 1
              fi
              cp "$f" "tarballs/$base$ext"
              chmod 0755 "tarballs/$base$ext"
              tar -C tarballs --owner=0 --group=0 --numeric-owner -czf "tarballs/$name.tar.gz" "$base$ext"
              rm -f "tarballs/$base$ext"
              count=$((count + 1))
            done
          done
          echo "Created $count tar.gz archives"
          test "$count" -gt 0
          for f in tarballs/*.tar.gz; do
            if [ "$(tar tzf "$f" | wc -l)" -ne 1 ]; then
              echo "::error::$f must contain exactly one file"
              exit 1
            fi
          done
      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: svenstaro/upload-release-action@2.10.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}-${{ steps.sha.outputs.short }}
          draft: true
          file_glob: true
          file: clang-*/**/*
          check_duplicates: false
      - name: upload tar.gz archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}-${GITHUB_SHA::7}" tarballs/*.tar.gz --repo "${{ github.repository }}" --clobber
